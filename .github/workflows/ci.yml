name: CI

on:
  push:
    branches-ignore: [gh-pages]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install -r requirements.txt
      - name: Build the site (strict)
        run: mkdocs build --strict
      # The consolidated-manual drift check was retired with the site redirect:
      # docs/ now holds only the "moved" notice, and HERO_Manual_Full_v*.md is
      # kept frozen as the last full manual text (do not regenerate it).
